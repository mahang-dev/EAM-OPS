name: eam-ops
services:
  mysql:
    image: mysql:8.4.6
    environment:
      MYSQL_DATABASE: eam_ops
      MYSQL_USER: ${DB_USER:-eam}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u$$MYSQL_USER -e 'SELECT 1' eam_ops"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7.4.2-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD}", "--appendonly", "yes"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  backend:
    build:
      context: ../backend
      dockerfile: ../deploy/backend.Dockerfile
    environment:
      DB_URL: jdbc:mysql://mysql:3306/eam_ops?useUnicode=true&characterEncoding=utf8&connectionTimeZone=Asia/Shanghai
      DB_USER: ${DB_USER:-eam}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-production}
      BOOTSTRAP_PASSWORD: ${BOOTSTRAP_PASSWORD:-}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
  web:
    build:
      context: ../frontend
      dockerfile: ../deploy/frontend.Dockerfile
    ports:
      - "127.0.0.1:${WEB_PORT:-8088}:80"
    depends_on:
      - backend
    restart: unless-stopped
volumes:
  mysql_data:
  redis_data:
